name: Zip ac
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip dosyasini ac
        run: |
          ZIP=$(ls *.zip | head -n1)
          mkdir /tmp/x && unzip -q "$ZIP" -d /tmp/x
          SRC=/tmp/x
          if [ "$(ls -A /tmp/x | wc -l)" -eq 1 ] && [ -d "/tmp/x/$(ls /tmp/x)" ]; then SRC="/tmp/x/$(ls /tmp/x)"; fi
          rm -rf koy-traktor-oyunu && mkdir koy-traktor-oyunu
          cp -a "$SRC"/. koy-traktor-oyunu/
          rm -f *.zip
      - name: Kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Zip acildi" || exit 0
          git push
