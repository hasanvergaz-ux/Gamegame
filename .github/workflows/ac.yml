name: Zip'i ac
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ac ve duzenle
        run: |
          mkdir /tmp/yeni
          unzip -q Traktor-duzgun.zip -d /tmp/yeni
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name Traktor-duzgun.zip -exec rm -rf {} +
          cp -a /tmp/yeni/. .
          rm Traktor-duzgun.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Proje duzgun klasorlerle yuklendi"
          git push
