name: Zip'i ac
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ac ve duzenle
        run: |
          ZIP=$(ls *.zip | head -1)
          echo "Bulunan zip: $ZIP"
          mkdir /tmp/yeni
          unzip -q "$ZIP" -d /tmp/yeni
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/yeni/. .
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Proje duzgun klasorlerle yuklendi"
          git push
